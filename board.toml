schema_version = 2

# OnePlus 6 (enchilada / SDM845) format 2 board record - SKELETON.
# Every value below is either measured on the target unit ([LOCAL]),
# taken from a same-SKU community port ([PORT]), or read from Mu-Silicium
# source ([MU]). Nothing here has been built or booted.
# The SoC layer this device needs (SDM845 / Napali) does not exist upstream.
# `soc_source` names the local UniXNU-sdm845-common working draft, which the
# feed reaches through feeds.toml's `local` key; `soc` keeps the chip's
# standard identifier for documentation.

[board]
name = "enchilada"
soc = "SDM845"
soc_source = "sdm845"
os_profile = "ipados-17.7.11-21H461"
description = "OnePlus 6 (A6003), 8 GB RAM / 128 GB storage, arm64 only (no FEAT_PAuth)"
kit = "enchilada"
example = false

[components]
# Catalog components from the upstream components.toml only.
include = [
  "ArmCpu",
  "ArmDTPlatform",
  "SoftwareAES",
  "XnuPrelink",
  "DarwinBoot",
  "RamBlock",
  "VerifiedRoot",
  "GopFramebuffer",
  "ArmSmmu4K",
]

[kernel]
defconfig = "enchilada_defconfig"
# patch_series is a LIST of series files (scripts/unixnu/patches.py:12 iterates it;
# a bare string would be iterated character by character).  Entries are resolved
# against the profile roots, so "device:" means this repository.  The community
# `kernel.archives` list is deliberately not copied: those build scripts live in
# format 1 repositories and a format 2 build never invokes them.
# soc-support.md step 4: keep the complete arch/SoC/OS/device lists, because
# ordinary arrays replace earlier arrays.  The arch profile's own list is not
# visible from here, so the SoC entries are added next to the device one.
# Keep the complete arch, SoC, OS and device lists: docs/porting/soc-support.md warns that
# "tables merge by key, while ordinary arrays replace earlier arrays".  A two-entry list
# here silently dropped the 56 arm64 patches and the 3 IPSW patches, which is exactly how
# the first kernel run failed: the arch series carries local-availability.patch, the fix
# for make_symbol_aliasing.sh looking for availability.pl inside the Xcode SDK.
patch_series = [
  "arch:patches/xnu/series",
  "soc:patches/xnu/series",
  "os:patches/xnu/series",
  "device:patches/xnu/series",
]
# Same rule as patch_series: an ordinary array replaces the earlier one, so the
# arch fragment has to be repeated here or profiles/arch/arm64/configs/common.config
# never reaches the generated .config.  enchilada_defconfig repeats its switches for
# readability, but the SoC and arch fragments are the authoritative source.
config_fragments = ["arch:configs/common.config", "soc:configs/sdm845.config"]
# kernel.archives has the same replace-not-append rule, and scripts/unixnu/kernel.py
# archive_plan() raises "[kernel] archives needs component entries for: X" for every
# selected component whose build_stage is kernel and that no component: entry names.
# The arch list is therefore repeated verbatim, plus RamBlock, which this board
# selects (storage stays off in the first boot, but the archive still has to be built).
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
  "component:RamBlock",
]

[kernel.prelink]
# profiles.load() merges arch/profile.toml, <soc>/soc.toml, os/profile.toml and
# this file in that order with a plain dict/list merge, so ANY key named here
# replaces the OS profile's value instead of extending it.  The 17.7.11 profile
# already supplies tool, kernel, kernelcache_sha256 and all 31 prelinked kext
# roots (the kernelcache digest it records is the one listed in
# reports/HARDWARE_INVENTORY.md), so the only values written here are the two
# this board actually decides.  Do not add `roots` or `kernel` unless they are
# being replaced on purpose: a placeholder there silently breaks the prelink step.
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"

# [ipsw] is NOT set here on purpose.  The OS profile
# profiles/os/ipados-17.7.11-21H461/profile.toml already names the exact
# restore image, its product/version/build/device_class/chip_id/board_id and the
# members to extract (KernelCache, DeviceTree, StaticTrustCache,
# Cryptex1,SystemTrustCache), and it carries the sha256 of the two DMGs.  The
# skeleton must not restate them: a second copy is a second thing to get wrong,
# and an invented URL would send `unixnu fetch` at nothing.
#
# What this board DOES still own is the platform seed: the unique chip ID is
# supplied at build time (UNIXNU_UNIQUE_CHIP_ID, 8 hex digits, kept as a CI
# secret and never committed), see [payload.adt] unique_chip_id below.

[userdata]
# Measured on this unit: first_lba is identical across SKUs, last_lba tracks capacity.
# 8 GB / 128 GB SKU -> 28,836,027 blocks x 4096 B = 118,112,366,592 B = 110.00 GiB,
# which matches df reporting 108 G for the formatted ext4 volume.
first_lba = 0x186f40
last_lba = 0x1d06ffa
lba_bytes = 4096

[device_tree]
# No candidate repository ships this file; it must be authored from scratch.
# Format 2 key names are `source` and `include_dirs`
# (docs/porting/device-tree.md, examples/device/board.toml:22-24).  The older
# `path` key this skeleton first used is not read by scripts/unixnu/devicetree.py.
# The board file /include/s the SoC dtsi; dtc resolves it through the one -i
# that devicetree.py:399-400 passes per include_dirs entry.
source = "device:dts/enchilada.dts"
include_dirs = ["soc:dts"]

[firmware]
# The Mu-Silicium checkout is passed at build time (--uefi); `config` names
# Resources/Configs/<name>.toml inside it, which is where the FD base and size
# come from (scripts/unixnu/firmware.py:12-16 validates the built FD against
# uefi_fd.base/size).  enchilada.toml says base=0x9FC00000, size=0x300000.
config = "enchilada"
dsc = "Platforms/OnePlus/enchiladaPkg/enchilada.dsc"
# {target} is the EDK II build target; firmware.py builds DEBUG unless told otherwise.
fd = "Build/enchiladaPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
source = "https://github.com/Project-Silicium/Mu-Silicium"
revision = "8471e47f5248ebbffc2e6196b683204163efe155"

# Mu-Silicium's own patches against the shared edk2 checkout, applied for the
# build and reverted afterwards (scripts/unixnu/firmware.py:56-70 reads exactly
# this key).  All four exist in the pinned checkout under Resources/MuPatches/.
# Leaving them out yields a firmware that builds, comes out at the right size,
# boots, and then misbehaves in the four places they fix:
#   Auth-Service  the authorisation service must start before the variable service
#   Boot-Manager  keeps the boot manager menu reachable
#   Timer         no timer reprogramming once the DXE core is up
#   Usb-Bus       survives a device disappearing mid-enumeration
# AsmMacroLib.patch is deliberately absent: MdePkg/Include/AArch64/AsmMacroLib.h
# already carries that fix in a newer form and applying the old patch undoes it.
patches = [
  "Resources/MuPatches/Auth-Service.patch",
  "Resources/MuPatches/Boot-Manager.patch",
  "Resources/MuPatches/Timer.patch",
  "Resources/MuPatches/Usb-Bus.patch",
]

# Submodules firmware.py initialises before the build.  Mu_Basecore is left out
# on purpose: it is supplied separately (firmware.py:31 comment).  All five names
# below are the ones declared in the pinned checkout's .gitmodules.
submodules = [
  "Binaries",
  "Common/Mu",
  "Common/Mu_OEM_Sample",
  "Silicium-ACPI",
  "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl",
]

# PACKAGES_PATH for the EDK II build.  Checked against the pinned checkout's
# tree: Platforms/OnePlus, Common/Mu, Common/Mu_OEM_Sample, Silicon/Qualcomm and
# Silicon/Silicium exist; the two Silicium-ACPI entries live inside the
# Silicium-ACPI submodule, so they only appear after firmware.py initialises the
# submodules above (this skeleton's local copy has them empty, no git on the host).
packages = [
  "{uefi}",
  "{uefi}/Platforms/OnePlus",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/OnePlus",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
DEVICE_MODEL = "enchilada"
BUILDID_STRING = "enchilada-bringup"
# Defaults of Mu-Silicium's build_uefi.py and DeviceBuild.py, which unixnu does
# not run: keep them explicit so the FD matches what the pinned sources expect.
ENABLE_SECUREBOOT = "0"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
# Gate the UniXNU modules from the companion Mu-Silicium patch.
# firmware.py forwards [firmware.defines] via `build -D KEY=VALUE`,
# overriding the DSC's UNIXNU_PAYLOAD = 0 default (same channel as
# FD_BASE/FD_SIZE/FD_BLOCKS).
UNIXNU_PAYLOAD = "1"

[bootimg]
pagesize = 4096
kernel_offset = 0x8000
ramdisk_offset = 0x1000000
tags_offset = 0x100

[bootimg.image]
header_version = 0
base = 0x0

[payload]
# Route 2: the linked kernel is ~120 MiB, far more than any initrd window can
# carry, so the payload ships in system_b and the boot image carries no ramdisk.
#
# The community bring-up measures a ~18 MiB initrd window and reports that
# Android's own ramdisk already sits at 0x8454D000-0x856FEF79.  The live FDT of
# THIS device contradicts that as an upper bound: /chosen gives
# linux,initrd-start=0x841c9000 and linux,initrd-end=0x856fe8cb, i.e. the window
# actually used is 0x15358cb = 22,239,435 B = 21.21 MiB, byte-identical to the
# ramdisk_size field of the boot_a header.  The real ceiling has never been
# measured here, so this file does not rely on the 18 MiB figure for anything.
volume = "system_b"
size_mib = 144
loader = "firmware"
title = "enchilada first boot: XNU to console"
# scripts/unixnu/devicetree.py:306 reads payload.dram_size from the [payload] table
# itself (not from [payload.adt]) and rejects any value that differs from the single
# device_type="memory" range in the hardware DTS.  MUST stay in sync with the DTS.
dram_size = "0x1fc8a0000"

[payload.adt]
# In schema 2 most of these keys are read from the merged board by
# scripts/unixnu/devicetree.py; the ones that still matter are chip_id,
# unique_chip_id, owned_memory_size, root_match_volume_uuid and the two
# ramdisk/persistence flags.  `tool` is a schema 1 key and is kept only as a note.
tool = "scripts/make-enchilada-adt.py"
# root-matching is an IOMedia UUID match against the APFS volume that the OS
# image puts on disk (devicetree.py:324-327, profiles/os/<profile>/profile.toml
# [root] os_volume_uuid).  It is NOT an Android partition GUID and does not
# depend on this handset, so the iPadOS 17.7.11 profile value stands here.
# Do not substitute the system_a GPT GUID (9F9B1E97-...) or the PARTUUID from
# the Android command line: those identify a partition, not a root volume.
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
owned_memory_size = "0x130000000"
# Why the DTS memory node is <0x0 0x80000000 0x1 0xfc8a0000>: it folds the two
# DRAM banks the live FDT describes (0x80000000+4 GiB and 0x180000000+3.95 GiB)
# into one run, because the generator requires exactly one contiguous range.  The
# nominal 8 GiB top is deliberately not declared: /proc/iomem ends System RAM at
# 0x27c89ffff, so 0x3760000 of the nominal size is never handed to software.
packed_data_ramdisk = true
persistent_data = true
ipad_identity = true
chip_id = "207"
unique_chip_id = "required"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
psci_method = "smc"

[package]
# scripts/package.sh reads this key to find the UniXNU checkout.  It is a path
# relative to this repository, so a sibling layout (device repo and UniXNU next
# to each other) is the documented arrangement.
unixnu = "../UniXNU"

[package.defconfig]
"ipados-17.7.11-21H461" = "enchilada_defconfig"
