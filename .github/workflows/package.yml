name: package

# Runs the packaging pipeline on a GitHub macOS runner, which is the only way to
# reach `clang`, `make`, `mtools` and (for IPSW work) `hdiutil`/`compression_tool`
# from this project, since no local Mac or Linux host is available.
#
# The platform seed comes from the repository secret UNIXNU_UNIQUE_CHIP_ID and is
# baked into the images, so a run's artifacts belong to one device alone: download
# them, then delete the run. Run it in a fork of this repository.
#
# The SoC layer is pulled as a sibling checkout of `device/` and reached through
# feeds.toml's `local` key, because the SDM845 SoC repository has no public pinned
# commit yet. Replace both with a pinned `git` source in feeds.toml before this
# repository is published.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["ios-16.7.16-20H392", "17", "26", "27"]
        default: "ios-16.7.16-20H392"
      soc_repository:
        description: "SDM845 SoC layer as owner/name"
        type: string
        default: "dragon120820/UniXNU-sdm845-common"
      soc_ref:
        description: "Ref of the SoC layer"
        type: string
        default: "main"
      mode:
        description: "check = preflight + patches only; check-deps also fetches every module and the IPSW; kernel = compile and prelink XNU; firmware = EDK II build of Mu-Silicium with the UniXNU payload; bootimg = pack the firmware into a fastboot-boot image; chain = the whole official chain (kernel, payload, firmware with the payload inside, boot image carrying it as ramdisk)"
        type: choice
        options: ["check", "check-deps", "kernel", "firmware", "bootimg", "payload", "package", "chain"]
        default: "check"
      xcode:
        description: "Xcode version of the macos-26 image"
        type: string
        default: "26.6"
      unixnu_repository:
        description: "UniXNU checkout as owner/name (a fork carrying profiles/os/ios-* )"
        type: string
        default: "dragon120820/UniXNU"
      unixnu_ref:
        description: "Ref of the UniXNU checkout"
        type: string
        default: "main"
      sec_entryarg:
        description: "Hand the bootloader x0 to DXE through the SEC entry HOB (the stock SEC drops it); disable to bisect a firmware that never lights the panel"
        type: choice
        options: ["yes", "no"]
        default: "yes"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  package:
    # Pinned, and pinned per mode.  macos-latest moves between images, so the
    # EDK II stage keeps the Xcode 26 line that macos-26 carries.
    #
    # The XNU stage used to be pinned back to macos-15 (Xcode 16.4) because
    # Xcode 26's iig emits IORPC.kernelContent, a field xnu-8796's IORPC did not
    # have, and DriverKit/OSObject.iig.cpp failed with "no member named
    # 'kernelContent' in 'IORPC'" (run 42875463977).  That is now fixed at the
    # source: patches/xnu/iokitcpp-kernel-content.patch gives 8796 the field
    # behind the same #ifdef KERNEL guard 10063 uses, so the XNU stage can run
    # on the image whose toolchain the upstream scripts are written for.
    #
    # Going back to macos-15 is not an option for the rest of the pipeline
    # either: Xcode 16.4's clang rejects flags the upstream helper scripts pass
    # unconditionally, e.g. "-Wno-unnecessary-virtual-specifier"
    # (run 42946585505, component-ArmDTPlatform).
    runs-on: macos-26
    timeout-minutes: 240
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode }}.app/Contents/Developer
      OS_PROFILE: ${{ inputs.os }}
      MODE: ${{ inputs.mode }}

    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: device

      # `[package] unixnu = "../UniXNU"` is relative to the device repository, so the
      # UniXNU checkout has to be its sibling, not a differently named directory.
      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          # A fork, not upstream: profiles/os/ there carries ios-16.7.16-20H392,
          # the OS layer an iPhone X userspace needs.  Upstream ships iPadOS and
          # macOS profiles only, and [board] os_profile names a directory under
          # profiles/os/ (scripts/unixnu/profiles.py:19-30).
          repository: ${{ inputs.unixnu_repository }}
          ref: ${{ inputs.unixnu_ref }}
          path: UniXNU

      # feeds.toml reaches the SoC layer as `local = "../UniXNU-sdm845-common"`,
      # resolved against the directory that holds feeds.toml.
      - name: Check out the SDM845 SoC layer
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.soc_repository }}
          ref: ${{ inputs.soc_ref }}
          path: UniXNU-sdm845-common

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The firmware stage needs a Mu-Silicium checkout (board.toml [firmware]
      # source/revision, 8471e47f). It is a public repository, and so is its
      # Device-Binaries submodule, so nothing proprietary is published by this
      # step: the run clones exactly what upstream already serves. Submodules are
      # left to firmware.py, which initialises the five names in board.toml.
      - name: Check out Mu-Silicium (firmware stage only)
        if: inputs.mode == 'firmware' || inputs.mode == 'bootimg' || inputs.mode == 'chain' || inputs.mode == 'payload'
        uses: actions/checkout@v4
        with:
          repository: Project-Silicium/Mu-Silicium
          ref: 8471e47f5248ebbffc2e6196b683204163efe155
          path: Mu-Silicium
          submodules: false
          fetch-depth: 1

      # The UniXNU payload is not upstream: add the four INF, the UniXNULib
      # mapping and the UNIXNU_PAYLOAD switch as a patch, so the checkout stays
      # byte-identical to the pinned commit everywhere else.
      - name: Apply the UniXNU payload patch to Mu-Silicium
        if: inputs.mode == 'firmware' || inputs.mode == 'bootimg' || inputs.mode == 'chain' || inputs.mode == 'payload'
        env:
          SEC_ENTRYARG: ${{ inputs.sec_entryarg }}
        run: |
          set -euo pipefail
          patch=$PWD/device/firmware/mu-silicium-unixnu-integration.patch
          [ -f "$patch" ] || { echo "::error::$patch missing"; exit 1; }
          sha256sum "$patch"
          # `git -C Mu-Silicium apply` resolves the patch name inside that repository,
          # so the path has to be absolute (a relative one fails with
          # "can't open patch ...: No such file or directory" after -C).
          git -C Mu-Silicium apply --check "$patch"
          git -C Mu-Silicium apply "$patch"
          git -C Mu-Silicium --no-pager diff --stat
          # Break the PcdDxe self-deadlock: PcdDxe links DxePcdLib whose depex is
          # gEfiPcdProtocolGuid, BaseTools merges library depex into the module
          # depex, so PcdDxe waits for the protocol it itself installs and never
          # dispatches (starving VariableRuntimeDxe/RTC/Capsule/... and tripping
          # DxeMain.c:581). Override PcdLib with BasePcdLibNull like upstream
          # OvmfPkgX64.dsc does.
          pcddxe=$PWD/device/firmware/mu-silicium-pcddxe-depex.patch
          [ -f "$pcddxe" ] || { echo "::error::$pcddxe missing"; exit 1; }
          sha256sum "$pcddxe"
          git -C Mu-Silicium apply --check "$pcddxe"
          git -C Mu-Silicium apply "$pcddxe"
          git -C Mu-Silicium --no-pager diff --stat | tail -2
          # Hand the bootloader's device tree to DXE. The stock SEC discards the
          # x0 the previous stage enters with and never builds
          # gSiliciumEntryArgHobGuid, so UniXNURamDiskDxe finds no HOB, gives up
          # and publishes no payload volume: the menu shows the built-in
          # configuration and reports "no boot entry found" even when the
          # ramdisk is there. Same fault as marble, recorded in UniXNU's
          # docs/devices/marble-milacy.md; the fix follows uefi-fuxi.
          if [ "${SEC_ENTRYARG:-yes}" = yes ]; then
            secarg=$PWD/device/firmware/mu-silicium-sec-entryarg.patch
            [ -f "$secarg" ] || { echo "::error::$secarg missing"; exit 1; }
            sha256sum "$secarg"
            git -C Mu-Silicium apply --check "$secarg"
            git -C Mu-Silicium apply "$secarg"
            git -C Mu-Silicium --no-pager diff --stat | tail -2
          else
            echo "sec entryarg: skipped on request; the payload volume will not be published"
          fi
          # The PCD probe: DEBUG prints inside PcdDxe's entry path and inside
          # the PCD database loader, so the next boot says whether the driver
          # ran and whether GetSectionFromFfs found the database. firmware.py
          # applies [firmware] patches relative to the Mu-Silicium checkout and
          # against the edk2 tree, so the patch has to sit in Resources/MuPatches/.
          probe=$GITHUB_WORKSPACE/device/firmware/mu-edk2-pcddxe-probe.patch
          [ -f "$probe" ] || { echo "::error::$probe missing"; exit 1; }
          sha256sum "$probe"
          # The patch targets edk2, not Mu-Silicium, so it is not applied here:
          # firmware.py applies [firmware] patches with -C <edk2> but reads the
          # file from inside the Mu-Silicium checkout, which is why it moves.
          cp "$probe" Mu-Silicium/Resources/MuPatches/mu-edk2-pcddxe-probe.patch
          ls -l Mu-Silicium/Resources/MuPatches/mu-edk2-pcddxe-probe.patch
          ls -l Mu-Silicium/Resources/MuPatches/mu-edk2-pcddxe-probe.patch
          # UNIXNU_PAYLOAD=1 must reach the EDK II build through board.toml
          # [firmware.defines]; assert the device repository actually carries it
          # so a firmware built without the payload cannot pass silently.
          grep -q 'UNIXNU_PAYLOAD' device/board.toml || {
            echo "::error::board.toml [firmware.defines] has no UNIXNU_PAYLOAD; the firmware would not contain the payload"
            exit 1
          }

      - name: Check the inputs
        id: check
        env:
          HAS_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID != '' }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -f device/board.toml ] || fail "the device repository has no board.toml"
          [ -f device/configs/enchilada_defconfig ] || fail "device/configs/enchilada_defconfig missing"
          [ -f device/feeds.toml ] || fail "the device repository has no feeds.toml"
          [ -d UniXNU-sdm845-common/dts ] || fail "the SoC layer has no dts/ directory"
          [ -f UniXNU-sdm845-common/soc.toml ] || fail "the SoC layer has no soc.toml"
          [ -d "$DEVELOPER_DIR" ] || fail "Xcode not found at $DEVELOPER_DIR; installed: $(printf '%s ' /Applications/Xcode_*.app)"
          echo "runner: $(sw_vers -productVersion) $(uname -m)"
          xcodebuild -version | head -n 2

      - name: Install host tools
        run: |
          # Homebrew LLVM is keg-only and stays off PATH: the driver finds it for the
          # archive builders, and everything else uses Xcode's clang.
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      # EDK II compiles the ACPI tables through iasl, which is not on the runner
      # image and is not part of BaseTools on macOS. Only the firmware stage needs it.
      - name: Install the firmware stage host tools
        if: inputs.mode == 'firmware' || inputs.mode == 'bootimg' || inputs.mode == 'chain' || inputs.mode == 'payload'
        run: |
          brew install acpica
          iasl -v | head -n 2

      - name: Report the runner toolchain
        run: |
          clang --version | head -n 1
          "$(brew --prefix llvm)/bin/clang" --version | head -n 1
          python3 --version
          missing=0
          for tool in git make clang cmake ninja unifdef ld.lld mformat mcopy dtc xcodebuild; do
            path=$(command -v "$tool" || true)
            printf '%-10s %s\n' "$tool" "${path:-MISSING}"
            [ -n "$path" ] || missing=1
          done
          df -h "$GITHUB_WORKSPACE"
          exit "$missing"

      - name: Check the device tree compiles
        run: |
          cd device
          dtc -I dts -O dtb -i ../UniXNU-sdm845-common/dts \
              -o "$RUNNER_TEMP/enchilada.dtb" dts/enchilada.dts
          ls -l "$RUNNER_TEMP/enchilada.dtb"
          fdtdump "$RUNNER_TEMP/enchilada.dtb" | head -n 20
          # The bootimg mode needs this DTB later in a different step; park it
          # where the case block can find it ($GITHUB_WORKSPACE/device/dts/).
          cp "$RUNNER_TEMP/enchilada.dtb" dts/enchilada.dtb

      # B7: the upstream UniXNU commit pinned here records two submodule commits
      # that do not exist on the remotes, so `git submodule update` fails with
      # "upload-pack: not our ref". Only `mode=check-deps` walks the submodules;
      # `mode=check` passes --no-deps and never touches them. This step rewrites the
      # two gitlinks in the *checkout* (never upstream) to the commits that do exist.
      # Remove it once upstream fixes its pins.
      - name: Repair the upstream submodule pins (B7)
        if: inputs.mode != 'check' && inputs.mode != 'check-deps-lite'
        run: |
          set -euo pipefail
          cd UniXNU
          echo "pins before:"; git ls-files -s drivers/ArmCpu kits/XnuPrelink
          # drivers/ArmCpu: the recorded 2e11cda7 does not exist; main is 93a5030c.
          git update-index --cacheinfo 160000,93a5030c5d983d0ef90f0fca93879d6e36ad1ba8,drivers/ArmCpu
          # kits/XnuPrelink: ef4fe4f9 exists but needs a direct fetch of the commit.
          git update-index --cacheinfo 160000,ef4fe4f9ec59faa04eba24025bac0fa2985dbe5b,kits/XnuPrelink
          echo "pins after:"; git ls-files -s drivers/ArmCpu kits/XnuPrelink
          echo "::warning::B7 workaround applied in the checkout only; upstream UniXNU still records bad pins"

      - name: Preflight and patches
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          # scripts/prepare-xnu-source.py restores 26 DriverKit headers through the
          # GitHub contents API. Anonymous calls share a per-address quota that
          # hosted runners exhaust (HTTP 403, observed on the fourth kernel run),
          # so hand it the workflow token. It is sent to api.github.com and
          # raw.githubusercontent.com only.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "$MODE" in
            check)
              # Fastest meaningful signal: format validation, profile merge, defconfig
              # generation and the patch series, without cloning six Apple source trees
              # or downloading the 4.7 GB IPSW.
              scripts/package.sh --check --no-deps --os "$OS_PROFILE"
              ;;
            check-deps)
              # Full dependency resolution: submodules, Apple source feeds, the IPSW and
              # its kernelcache. Needs `compression_tool`, which is why this only runs on
              # a macOS runner.
              scripts/package.sh --check --os "$OS_PROFILE"
              ;;
            kernel)
              # First real build step: compile the patched XNU for arm64 and prelink it
              # against the IPSW kernelcache. This is the entry point of P4/P5.
              #
              # Run from the UniXNU checkout so `[package] unixnu = "../UniXNU"` and the
              # sibling SoC checkout keep their relative positions. `fetch` runs first
              # because the kernel step needs every Apple source tree and the IPSW
              # kernelcache, which is also what `check-deps` proves works.
              cd ../UniXNU
              python3 ./unixnu fetch --device ../device
              # The kernel step needs a selected configuration; `defconfig` records it in
              # out/state.json, which `build kernel` then reads back.
              python3 ./unixnu defconfig enchilada_defconfig --device ../device --os "$OS_PROFILE"
              # --skip-prelink: see the payload branch.  The native kernel is what this
              # port boots; there is no 20H392 kernelcache to hash against.
              python3 ./unixnu build kernel --device ../device --os "$OS_PROFILE" --skip-prelink
              ;;
            firmware)
              # First firmware build: EDK II compiles the UniXNU payload into Mu-Silicium's
              # enchilada FD (CLANGPDB, AARCH64) and firmware.py refuses to pass unless the
              # result is exactly Resources/Configs/enchilada.toml uefi_fd.size bytes.
              #
              # Nothing here touches the phone: no fastboot, no flash, no boot image. This
              # only proves the integration compiles and links; the device-side stage stays
              # behind its own authorisation.
              cd ../UniXNU
              python3 ./unixnu fetch --device ../device
              python3 ./unixnu defconfig enchilada_defconfig --device ../device --os "$OS_PROFILE"
              python3 ./unixnu build firmware --device ../device --os "$OS_PROFILE" --uefi ../Mu-Silicium --target RELEASE
              ls -l ../Mu-Silicium/Build/enchiladaPkg/*_CLANGPDB/FV/SILICIUM_UEFI.fd
              # The FD itself is not uploaded (logs only), so the hash has to be
              # printed here: it is the only way to record a firmware identity
              # without publishing the bytes.
              sha256sum ../Mu-Silicium/Build/enchiladaPkg/*_CLANGPDB/FV/SILICIUM_UEFI.fd
              ;;
            bootimg)
              # Pack the built FD into an Android boot image for `fastboot boot` only.
              # This writes nothing to any partition; the device-side stage (actually
              # running fastboot boot) is a separate, user-authorised step.
              cd ../UniXNU
              python3 ./unixnu fetch --device ../device
              python3 ./unixnu defconfig enchilada_defconfig --device ../device --os "$OS_PROFILE"
              python3 ./unixnu build firmware --device ../device --os "$OS_PROFILE" --uefi ../Mu-Silicium --target RELEASE
              FD=$(ls ../Mu-Silicium/Build/enchiladaPkg/*_CLANGPDB/FV/SILICIUM_UEFI.fd)
              sha256sum "$FD"
              # The ABL inflates the gzip kernel package and expects an ARM64 Image
              # header (magic at offset 56). BootShim.S stores FD_SIZE verbatim as
              # Image Size while the protocol (and unixnu bootimg's self-check) want
              # shim+FD total, so patch the shim to emit the correct field
              # (a dedicated Mu patch, checked in). Upstream keeps
              # requires_kernel_header = true, as every working device does.
              SHIM=$GITHUB_WORKSPACE/device/firmware/mu-silicium-bootshim-image-header.patch
              sha256sum "$SHIM"
              git -C ../Mu-Silicium apply --check "$SHIM"
              git -C ../Mu-Silicium apply "$SHIM"
              # The firmware FDT is what Mu-Silicium's SEC/PlatformPei reads for the
              # DRAM map, reserved-memory and UART. Mu ships the full enchilada tree
              # (555398 bytes, the same size the community boot-enchilada.img appends);
              # the format2 device tree is a 2697-byte working draft and starves the
              # firmware, which then hangs before display or USB init. Use Mu's tree
              # for the firmware FDT and keep ours for the UniXNU ADT.
              # The community images boot with a non-empty placeholder ramdisk
              # (edk2-msm build.sh writes a one-byte file); keep that shape.
              echo > "$RUNNER_TEMP/ramdisk"
              DTB=../Mu-Silicium/Resources/DTBs/enchilada.dtb
              test -f "$DTB" || { echo "::error::Mu-Silicium firmware FDT missing: $DTB"; exit 1; }
              sha256sum "$DTB"
              python3 ./unixnu bootimg --device ../device --os "$OS_PROFILE" --uefi ../Mu-Silicium \
                --fd "$FD" --dtb "$DTB" --ramdisk "$RUNNER_TEMP/ramdisk" -o ../UniXNU/out/boot/boot.img
              ls -l ../UniXNU/out/boot/
              sha256sum ../UniXNU/out/boot/boot.img
              cat ../UniXNU/out/boot/boot.json
              ;;
            payload)
              # Layer 4 prerequisite: the official ADT and payload volume.  DarwinBoot
              # demands a /chosen/memory-map placeholder for every input it is handed,
              # and only scripts/unixnu/devicetree.py writes those.  This mode runs
              # schema 2 (board.toml is schema_version = 2, so generate() compiles our
              # board DTS with dtc) and produces the FAT volume that carries
              # kernel.macho and kernel.macho.adt into the boot image ramdisk.
              #
              # It fails loudly when the board DTS cannot satisfy the generator: one
              # contiguous DRAM range, /cpus with timebase-frequency and a PSCI method.
              cd ../UniXNU
              python3 ./unixnu fetch --device ../device
              python3 ./unixnu defconfig enchilada_defconfig --device ../device --os "$OS_PROFILE"
              # --skip-prelink stages the native kernel as kernel.macho.  Static prelink
              # hashes the ORIGINAL Apple kernelcache and grafts its kexts on; this port
              # keeps the community Mach-O kernel and has no 20H392 kernelcache, so the
              # step would abort on the missing [kernel.prelink] kernelcache field
              # (run 42954929695, KeyError at kernel.py:271).  stage_native() still
              # checks the MH_EXECUTE/ARM64 header and records the digest.
              python3 ./unixnu build kernel --device ../device --os "$OS_PROFILE" --skip-prelink
              # The ADT generator refuses a zero platform seed ("Platform identity
              # requires a nonzero u64 seed and u32 chip ID", devicetree.py:311-315),
              # so pass a nonzero placeholder.  This is a bring-up value: the ADT node
              # names this build, not the handset.  Run 42858923330 failed here with
              # all-zeroes; the real chip identity comes later (HARDWARE_INVENTORY.md).
              python3 ./unixnu build payload --device ../device --os "$OS_PROFILE" --uefi ../Mu-Silicium \
                --unique-chip-id 0123456789abcdef
              ls -l ../UniXNU/out/*/*/*/payload/
              cat ../UniXNU/out/*/*/*/payload/payload.json
              sha256sum ../UniXNU/out/*/*/*/payload/payload.img
              ;;

            chain)
              # The whole official boot chain in one job, because each link is only
              # meaningful with the next one present: the kernel becomes kernel.macho
              # (skip-prelink: no 20H392 kernelcache to hash), the payload volume
              # carries kernel.macho + kernel.macho.adt + unixnu.toml, the firmware
              # volume gets UniXNU.efi/UniXNUDxe.efi/UniXNURamDiskDxe.efi/DarwinBoot
              # through UNIXNU_PAYLOAD=1, and bootimg wraps shim+FD into a boot image
              # whose ramdisk IS the payload volume - that ramdisk is what
              # UniXNURamDiskDxe publishes as a FAT volume for UniXNU to read
              # unixnu.toml from.  Layers 1-4 of the porting guide, no partition writes.
              cd ../UniXNU
              python3 ./unixnu fetch --device ../device
              python3 ./unixnu defconfig enchilada_defconfig --device ../device --os "$OS_PROFILE"
              python3 ./unixnu build kernel --device ../device --os "$OS_PROFILE" --skip-prelink
              python3 ./unixnu build payload --device ../device --os "$OS_PROFILE" --uefi ../Mu-Silicium \
                --unique-chip-id 0123456789abcdef
              PAYLOAD=$(ls ../UniXNU/out/*/*/*/payload/payload.img)
              test -f "$PAYLOAD" || { echo "::error::payload.img missing"; exit 1; }
              sha256sum "$PAYLOAD"
              cat ../UniXNU/out/*/*/*/payload/payload.json
              python3 ./unixnu build firmware --device ../device --os "$OS_PROFILE" --uefi ../Mu-Silicium --target RELEASE
              FD=$(ls ../Mu-Silicium/Build/enchiladaPkg/*_CLANGPDB/FV/SILICIUM_UEFI.fd)
              test -f "$FD" || { echo "::error::SILICIUM_UEFI.fd missing"; exit 1; }
              sha256sum "$FD"
              SHIM=$GITHUB_WORKSPACE/device/firmware/mu-silicium-bootshim-image-header.patch
              sha256sum "$SHIM"
              git -C ../Mu-Silicium apply --check "$SHIM"
              git -C ../Mu-Silicium apply "$SHIM"
              DTB=../Mu-Silicium/Resources/DTBs/enchilada.dtb
              test -f "$DTB" || { echo "::error::Mu-Silicium firmware FDT missing: $DTB"; exit 1; }
              sha256sum "$DTB"
              python3 ./unixnu bootimg --device ../device --os "$OS_PROFILE" --uefi ../Mu-Silicium \
                --fd "$FD" --dtb "$DTB" --ramdisk "$PAYLOAD" -o ../UniXNU/out/boot/boot.img
              ls -l ../UniXNU/out/boot/
              sha256sum ../UniXNU/out/boot/boot.img
              cat ../UniXNU/out/boot/boot.json
              ;;
            package)
              # Layer 3 of the porting guide: compile package/ (UniXNU.efi, UniXNUDxe.efi,
              # UniXNURamDiskDxe.efi) with EDK II.  This is the boot manager the guide
              # lists between the firmware and the loader, and it is the one product the
              # bring-up procedures cannot do without: without it the firmware volume
              # drops straight from UEFI to whatever the shim payload contains.
              #
              # It needs the edk2 refer tree with three submodules (BaseFdtLib/libfdt,
              # MipiSysTLib/mipisyst, BrotliCompress/brotli) and the BaseTools host
              # utilities.  None of that is a submodule of this repository, so they are
              # initialised and built here rather than assumed.
              cd ../UniXNU
              python3 ./unixnu fetch --device ../device
              python3 ./unixnu defconfig enchilada_defconfig --device ../device --os "$OS_PROFILE"
              EDK2=$(ls -d ../UniXNU/out/feeds/mu_basecore-* | head -1)
              test -f "$EDK2/MdePkg/MdePkg.dec" || { echo "::error::no edk2 tree: $EDK2"; exit 1; }
              echo "edk2: $EDK2"
              git -C "$EDK2" submodule update --init --depth 1 \
                MdePkg/Library/BaseFdtLib/libfdt \
                MdePkg/Library/MipiSysTLib/mipisyst \
                BaseTools/Source/C/BrotliCompress/brotli
              python3 ./unixnu build package --device ../device --os "$OS_PROFILE" --edk2 "$EDK2" --target RELEASE
              # package.build() points UNIXNU_BUILD_DIR at the run's work directory, so
              # the products land under out/<device>/<profile>/<config>/package/.
              OUT=$(find ../UniXNU/out -type d -path '*/Build/Out/AARCH64-RELEASE' | head -1)
              test -n "$OUT" && test -d "$OUT" || { echo "::error::package outputs not found"; exit 1; }
              ls -l "$OUT"
              for module in UniXNU UniXNUDxe UniXNURamDiskDxe; do
                test -f "$OUT/$module.efi" || { echo "::error::$module.efi missing from $OUT"; exit 1; }
                sha256sum "$OUT/$module.efi"
              done
              ;;

          esac

      - name: Upload the native kernel (kernel mode only)
        if: inputs.mode == 'kernel'
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-kernel-${{ inputs.os }}
          retention-days: 7
          path: |
            UniXNU/out/*/*/*/kernel/kernel.macho
            UniXNU/out/*/*/*/kernel/kernel.json
          if-no-files-found: error

      - name: Upload the payload (payload mode only)
        if: inputs.mode == 'payload'
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-payload-${{ inputs.os }}
          path: |
            UniXNU/out/*/*/*/payload/payload.img
            UniXNU/out/*/*/*/payload/payload.json
          if-no-files-found: error

      - name: Collect the logs
        if: always()
        run: |
          # Only text logs are uploaded. Kernels, payloads, disk images, kernelcaches
          # and IPSW members are never published: they derive from Apple software.
          mkdir -p "$RUNNER_TEMP/logs"
          # The step logs live in out/<device>/<os profile>/<config>/logs/, so the glob
          # needs both the profile and the config level. A one-level glob silently found
          # nothing on the first kernel run and cost a whole round trip to diagnose.
          for f in UniXNU/out/enchilada/*/*/logs/*.log; do
            [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/logs/$(basename "$f")"
          done
          if [ -d device/build ]; then
            find device/build -name '*.log' -exec cp {} "$RUNNER_TEMP/logs/" \; 2>/dev/null || true
          fi
          ls -l "$RUNNER_TEMP/logs" || true

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.mode }}-${{ inputs.os }}
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/logs
      - name: Upload the boot image (bootimg mode only)
        if: ${{ inputs.mode == 'bootimg' || inputs.mode == 'chain' }}
        uses: actions/upload-artifact@v4
        with:
          name: boot-img-os-${{ inputs.os }}
          path: |
            UniXNU/out/**/boot/boot.img
            UniXNU/out/**/boot/boot.json
          if-no-files-found: error

